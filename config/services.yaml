parameters:
    uploads_dir: '%kernel.project_dir%/%env(UPLOADS_DIR)%'
    openai_model: '%env(default:default_openai_model:OPENAI_MODEL)%'
    default_openai_model: 'gpt-5.2'
    openai_api_key_default: ''
    app_plan_default: 'professional'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $uploadsDir: '%uploads_dir%'
            string $openAiModel: '%openai_model%'
            $openAiApiKey: '%env(default:openai_api_key_default:OPENAI_API_KEY)%'
            $currentPlan: '%env(default:app_plan_default:APP_PLAN)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
